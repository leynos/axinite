# Nextest configuration
# https://nexte.st/docs/configuration/

[profile.default]
# Exclude `trybuild` from the local default run. Its tests invoke Cargo to
# prepare the generated project, compile fixtures and execute them.
#
# It is the only required contract binary this filter excludes. The other,
# `schema_helpers_ui`, runs in default and ci and executes accepted public API
# call sites compiled with its integration target before the test timer starts.
# The matching overrides keep both required contracts in the serial group;
# only nested trybuild sessions need 1500s.
#
# The ci profile below runs both. Coverage excludes both from its test
# selection; separate required jobs run the contracts with the baseline
# feature matrix.
default-filter = 'not binary(trybuild)'
# Kill a test that has run for five minutes rather than reporting it slow
# for ever. Nothing else here bounds a single test, so without this the
# only timer that ends a hang is the job's own, which cancels the run and
# discards the log that would have named the test. Five minutes is a bound
# rather than a measurement: ordinary tests stay below it, while nested
# trybuild sessions have an explicit override.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
# The whole run's budget. Above the largest per-test allowance in either
# profile, and twice the longest instrumented run measured.
# See "Test timeouts: the tiers this repository sets" in the developers'
# guide.
global-timeout = "30m"

[profile.ci]
# CI runs everything, including the trybuild compile-contract tests.
default-filter = 'all()'
# A custom profile inherits `[profile.default]`, and nextest also consults
# `[[profile.default.overrides]]` when this profile is selected, so these
# lines are not required for the run to be bounded. They are repository
# policy: this profile includes both required contract targets. Stating its
# own budgets here keeps the values that govern CI beside the profile a reader
# selects, rather than one section away.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

# Coverage instrumentation uses extra rustc flags. Keep the compile-contract
# tests in the separate required nextest job so their contracts run without
# coverage instrumentation.
[profile.coverage]
inherits = "ci"
default-filter = 'not binary(trybuild) and not binary(schema_helpers_ui)'
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

# `trybuild` uses a shared generated project and lock while preparing
# dependencies, compiling fixtures and running them. Keep both required
# contract targets in one nextest group so their test processes run serially.
# `schema_helpers_ui` no longer invokes nested Cargo; its fixture source is
# compiled with the integration target before the test timer starts. Ordinary
# tests stay in nextest's default group and retain the configured parallelism.
#
# The default and ci profiles carry this override because default runs
# `schema_helpers_ui`, while ci runs both required contract targets. Coverage
# inherits the ci override and filters both binaries out. The 1500s timeout is
# per nested trybuild test session, not per fixture or per binary.
#
# The schema-helper test has an explicit ordinary 300s runtime bound, declared
# first because nextest applies the first matching value for a field. Its Rust
# source compiles before the test process starts; the shared override below
# supplies its serial group while retaining 1500s for nested trybuild sessions.
[test-groups.compile-contracts]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(schema_helpers_ui)'
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
filter = 'binary(trybuild) | binary(schema_helpers_ui)'
test-group = 'compile-contracts'
slow-timeout = { period = "1500s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
filter = 'binary(schema_helpers_ui)'
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
filter = 'binary(trybuild) | binary(schema_helpers_ui)'
test-group = 'compile-contracts'
slow-timeout = { period = "1500s", terminate-after = 1, grace-period = "5s" }

# Bound the Postgres tests, not because they interfere with each other (each
# gets its own database), but because they share one cluster's connection
# limit. The cluster allows 64 (`PG_MAX_CONNECTIONS` in `.cargo/config.toml`)
# and each test's pool takes 2 (`TEST_POOL_SIZE`), so 16 concurrent tests use
# 32 and leave headroom for the template connection, the administrative
# connection that creates and drops each clone, and pools that have not yet
# released. Every other test runs at full parallelism.
[test-groups.pg-embed]
max-threads = 16

[[profile.default.overrides]]
filter = 'test(/^db::postgres::/) or test(/^history::store::/) or test(/^testing::postgres::embedded::/)'
test-group = 'pg-embed'

[[profile.ci.overrides]]
filter = 'test(/^db::postgres::/) or test(/^history::store::/) or test(/^testing::postgres::embedded::/)'
test-group = 'pg-embed'
