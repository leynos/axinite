# Nextest configuration
# https://nexte.st/docs/configuration/

[profile.default]
# Exclude `trybuild` from the local default run. It compiles the explicit
# fixtures through trybuild's shared generated project, so preparation and
# fixture compilation take substantially longer than ordinary tests.
#
# It is the only compile-contract binary this filter excludes. The other,
# `schema_helpers_ui`, runs in the default and ci profiles and checks accepted
# schema helper call-site types. The matching overrides below assign both
# binaries to the shared serial group and give each test a 900s timeout;
# `compile_contract_budget_test.py` pins discovery and profile selection.
#
# The ci profile below runs both. The coverage profile excludes both because
# fixture compilation under instrumentation exceeded the hosted test budget;
# separate CI jobs run the contracts without instrumentation.
default-filter = 'not binary(trybuild)'
# Kill a test that has run for five minutes rather than reporting it slow
# for ever. Nothing else here bounds a single test, so without this the
# only timer that ends a hang is the job's own, which cancels the run and
# discards the log that would have named the test. Five minutes is a bound
# rather than a measurement: no single test in this profile approaches it,
# and the whole instrumented run, compilation included, has never exceeded
# 900 s.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
# The whole run's budget. Above the largest per-test allowance in either
# profile, and twice the longest instrumented run measured.
# See "Test timeouts: the tiers this repository sets" in the developers'
# guide.
global-timeout = "30m"

[profile.ci]
# CI runs everything, including the trybuild compile-contract tests.
default-filter = 'all()'
# A custom profile inherits `[profile.default]`, and nextest also consults
# `[[profile.default.overrides]]` when this profile is selected, so these
# lines are not required for the run to be bounded. They are repository
# policy: this is the profile that includes the trybuild binaries, and
# stating its own budgets here keeps the values that govern CI where a
# reader of this profile will find them, rather than one section away.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

# Coverage instrumentation recompiles dependencies and fixtures with extra
# rustc flags. Keep the compile-contract binaries in the separate, ordinary
# nextest job so this profile measures runtime coverage without compiling UI
# fixtures under instrumentation.
[profile.coverage]
inherits = "ci"
default-filter = 'not binary(trybuild) and not binary(schema_helpers_ui)'
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

# `trybuild` and `schema_helpers_ui` share trybuild's generated project and
# lock while preparing dependencies, compiling fixtures, and running them.
# Keep those tests in one nextest group so separate test processes queue
# instead of contending for preparation. Ordinary tests stay in nextest's
# default group and retain the configured parallelism.
#
# The default and ci profiles carry this override because default runs
# `schema_helpers_ui`, while ci runs both compile-contract binaries. Coverage
# inherits the ci override and filters both binaries out. The timeout is per
# nextest test (one trybuild session after fixture batching), not per fixture
# or per binary.
[test-groups.compile-contracts]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(trybuild) | binary(schema_helpers_ui)'
test-group = 'compile-contracts'
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
filter = 'binary(trybuild) | binary(schema_helpers_ui)'
test-group = 'compile-contracts'
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }

# Bound the Postgres tests, not because they interfere with each other (each
# gets its own database), but because they share one cluster's connection
# limit. The cluster allows 64 (`PG_MAX_CONNECTIONS` in `.cargo/config.toml`)
# and each test's pool takes 2 (`TEST_POOL_SIZE`), so 16 concurrent tests use
# 32 and leave headroom for the template connection, the administrative
# connection that creates and drops each clone, and pools that have not yet
# released. Every other test runs at full parallelism.
[test-groups]
pg-embed = { max-threads = 16 }

[[profile.default.overrides]]
filter = 'test(/^db::postgres::/) or test(/^history::store::/)'
test-group = 'pg-embed'

[[profile.ci.overrides]]
filter = 'test(/^db::postgres::/) or test(/^history::store::/)'
test-group = 'pg-embed'
