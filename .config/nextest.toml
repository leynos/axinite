# Nextest configuration
# https://nexte.st/docs/configuration/

[profile.default]
# Exclude `trybuild` from the local default run. It spawns a fresh rustc
# per case against the full crate and takes ~7 minutes, which is most of
# what a local run costs.
#
# It is the only compile-contract binary this filter excludes, and there
# are two. `schema_helpers_ui` is not excluded and runs in both
# profiles: it is two pass-only cases proving `require_str` and
# `require_param` accept both a `&str` and a `ParamName` at their call
# sites, and it measured 244s, 249s and 257s rather than seven minutes.
# The 900s override below is what keeps it from being terminated by the
# 300s base allowance; `compile_contract_budget_test.py` pins both the
# discovered set and which profile excludes which.
#
# The ci profile below runs both.
default-filter = 'not binary(trybuild)'
# Kill a test that has run for five minutes rather than reporting it slow
# for ever. Nothing else here bounds a single test, so without this the
# only timer that ends a hang is the job's own, which cancels the run and
# discards the log that would have named the test. Five minutes is a bound
# rather than a measurement: no single test in this profile approaches it,
# and the whole instrumented run, compilation included, has never exceeded
# 900 s.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
# The whole run's budget. Above the largest per-test allowance in either
# profile, and twice the longest instrumented run measured.
# See "Test timeouts: the tiers this repository sets" in the developers'
# guide.
global-timeout = "30m"

[profile.ci]
# CI runs everything, including the trybuild compile-contract tests.
default-filter = 'all()'
# A custom profile inherits `[profile.default]`, and nextest also consults
# `[[profile.default.overrides]]` when this profile is selected, so these
# lines are not required for the run to be bounded. They are repository
# policy: this is the profile that includes the trybuild binaries, and
# stating its own budgets here keeps the values that govern CI where a
# reader of this profile will find them, rather than one section away.
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

# The compile-contract binaries spawn a fresh rustc per case against the
# full crate, so a whole binary is minutes rather than seconds and the
# 300 s base allowance does not fit one. `trybuild` takes about seven
# minutes together, which is why the default profile excludes it;
# `schema_helpers_ui` is not excluded and measured 244 s, 249 s and 257 s
# on run 34159479674 and then exceeded 300 s on 34271865377, which is what
# a bound sized to the ordinary tests does to a binary of this kind.
#
# Both profiles carry the override because both run `schema_helpers_ui`.
# Fifteen minutes is a bound rather than a measurement.
[[profile.default.overrides]]
filter = 'binary(trybuild) | binary(schema_helpers_ui)'
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
filter = 'binary(trybuild) | binary(schema_helpers_ui)'
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }
