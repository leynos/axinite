# The embedded PostgreSQL cluster's version is pinned here rather than in the
# fixture, because the library reads it from the environment during bootstrap
# and a test process cannot safely set its own environment once threads exist.
# Cargo applies this to every process it runs, so `cargo test`, `cargo nextest`
# and `cargo llvm-cov` all agree. nextest's own config has no `env` key: it
# warns "ignoring unknown configuration keys: env" and carries on, which is why
# this lives here.
#
# The range is capped at 16 because the prebuilt pgvector archive publishes
# PostgreSQL 16 assets only. Installing into a 17 or 18 tree fails with "asset
# not found", which reads as a missing file rather than as a version problem, so
# the cap is what turns that into a decision recorded here.
#
# The minor is deliberately left open. PostgreSQL's own guard is the module
# magic block, which encodes the major version and layout constants and not the
# minor, so a module built for one 16.x loads into another: the archive's single
# pg16 asset was built against 16.4 or earlier in October 2024 and loads into
# 16.15 without complaint. Pinning the minor would buy nothing and would need
# moving every time either side published.
[env]
PG_VERSION_REQ = "^16"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
