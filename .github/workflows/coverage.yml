---
# Code Coverage Workflow
#
# This workflow runs test coverage analysis and uploads reports to Codecov.
# Coverage reports help identify untested code paths and maintain code quality.
#
# What it does:
# - Runs unit and integration tests with coverage instrumentation
# - Runs E2E tests with coverage instrumentation
# - Uploads coverage reports to Codecov (https://codecov.io/gh/leynos/axinite)
#
# Viewing coverage reports:
# - PRs automatically get coverage comments showing changes in coverage
# - Visit https://codecov.io/gh/leynos/axinite for detailed coverage reports
# - Coverage reports are generated for three configurations:
#   1. all-features: Full feature set
#   2. default: Default features
#   3. libsql-only: Minimal libSQL-only configuration
# - E2E coverage tracks end-to-end test coverage separately
#
# Coverage files:
# - Unit/integration: lcov.info (uploaded to Codecov with "unit" flag)
# - E2E: e2e-coverage.info (uploaded to Codecov with "e2e" flag)
#
# Requirements:
# - Uses cargo-llvm-cov for coverage instrumentation
# - Requires PostgreSQL for integration tests (pgvector/pgvector:pg16)
# - E2E tests require Python 3.12 and Playwright

name: Code Coverage
"on":
  push:
    branches: [main]
  # Allow the CodeScene upload to be re-run on demand. Merges performed
  # by the automerge workflow's GITHUB_TOKEN do not fire push-event
  # workflows, so automerged changes to main only receive a CodeScene
  # upload via this manual dispatch.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Tool pins shared by every job; installed from pinned, checksum-verified
# release archives with `fallback: none` so no job can compile a tool.
env:
  CARGO_COMPONENT_VERSION: '0.21.1'
  CARGO_LLVM_COV_VERSION: '0.8.7'
  CARGO_NEXTEST_VERSION: '0.9.140'

jobs:
  coverage:
    name: Coverage (${{ matrix.name }})
    runs-on: ubicloud-standard-4
    timeout-minutes: 90
    env:
      # sccache is the sole owner of compiler output: no cache step archives a
      # target tree. RUSTC_WRAPPER is what actually engages it; installing
      # sccache without exporting this compiles everything as before.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # sccache cannot cache incremental compilation.
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            flags: "--all-features"
            has_postgres: true
          - name: default
            flags: ""
            has_postgres: true
          - name: libsql-only
            flags: "--no-default-features --features libsql"
            has_postgres: false
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axinite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - uses: actions/checkout@v6

      # Right-sizing needs the peak memory and the low-water disk mark, and
      # neither is visible in a job's own output. The sampler runs alongside
      # the build and reports both at the end, with `if: always()` so a job
      # that fails on resources still says so.
      - name: Start resource sampler
        run: ./scripts/ci-resource-sampler.sh start

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      # The free-disk-space step above removes large apt packages,
      # including the clang the CARGO_..._LINKER env demands. Reinstall
      # it (as test.yml does) so the host build scripts link.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install mold
        uses: rui314/setup-mold@v1

      # Ubicloud's transparent cache proxy serves the Actions cache from a
      # local address. sccache's GitHub Actions backend reads
      # ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN from the runner's own
      # environment, which is not visible to `run:` steps, so re-export them.
      # Clearing ACTIONS_CACHE_SERVICE_V2 keeps sccache on the v1 protocol the
      # proxy serves; exporting ACTIONS_RESULTS_URL instead does not work.
      - name: Export the Actions cache endpoint for sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            // Ubicloud's control plane writes the proxy address into the VM
            // environment. Report which variable supplied it, and whether the
            // token was present at all, so a misconfigured backend is
            // diagnosable from the log rather than from a slower build. Never
            // print the token itself.
            const cacheUrl =
              process.env.ACTIONS_CACHE_URL ||
              process.env.CUSTOM_ACTIONS_CACHE_URL ||
              '';
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const source = process.env.ACTIONS_CACHE_URL
              ? 'ACTIONS_CACHE_URL'
              : process.env.CUSTOM_ACTIONS_CACHE_URL
                ? 'CUSTOM_ACTIONS_CACHE_URL'
                : 'none';
            core.info(`sccache cache endpoint source: ${source}`);
            core.info(`sccache cache endpoint present: ${Boolean(cacheUrl)}`);
            core.info(`sccache runtime token present: ${Boolean(runtimeToken)}`);
            if (!cacheUrl || !runtimeToken) {
              core.warning(
                'sccache has no Actions cache endpoint; every compilation ' +
                  'will miss and the wrapper will only add overhead',
              );
            }
            core.exportVariable('ACTIONS_CACHE_URL', cacheUrl);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', '');
      - name: Install sccache
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: sccache@0.16.0
          fallback: none
      - name: Start sccache statistics
        run: |
          set -euo pipefail
          sccache --version
          sccache --zero-stats
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
          fallback: none

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
          fallback: none

      - name: Install cargo-binstall
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-binstall@1.20.1
          fallback: none

      - name: Install cargo-component
        env:
          CARGO_COMPONENT_PIN: ${{ env.CARGO_COMPONENT_VERSION }}
        run: >-
          cargo binstall --no-confirm
          --strategies crate-meta-data,quick-install
          "cargo-component@$CARGO_COMPONENT_PIN"

      - name: Probe Cargo tooling
        run: |
          set -euo pipefail
          cargo llvm-cov --version
          cargo nextest --version
          cargo component --version

      - name: Build GitHub WASM tool (for metadata/schema tests)
        run: make build-github-tool-wasm

      - name: Build WASM channels (for integration tests)
        run: ./scripts/build-wasm-extensions.sh --channels

      - name: Run database migrations
        if: matrix.has_postgres
        run: |
          set -euo pipefail
          readarray -t migration_files < <(
            printf '%s\n' migrations/V*.sql | sort -V
          )
          for f in "${migration_files[@]}"; do
            echo "Applying $f..."
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: axinite_test

      - name: Set DATABASE_URL for postgres configs
        if: matrix.has_postgres
        run: |
          database_url="postgres://postgres:postgres@localhost/axinite_test"
          echo "DATABASE_URL=${database_url}" >> "$GITHUB_ENV"

      # Instrument with nextest, not plain `cargo test`: the startup
      # boot-screen snapshot test captures stdout at file-descriptor
      # level (gag) and needs nextest's process-per-test isolation, so
      # the `cargo test` baseline llvm-cov drives otherwise fails
      # (issue #237). nextest also skips doctests; the default profile
      # additionally drops the slow trybuild binaries.
      - name: Generate coverage
        run: >-
          cargo llvm-cov nextest ${{ matrix.flags }} --features test-helpers
          --workspace --lcov
          --output-path lcov.info

      # Feed CodeScene's stored coverage from the analysed branch (main).
      # Upload from ONE leg only so CodeScene receives a single report
      # per commit. The libsql-only leg is chosen because it is the leg
      # that reliably builds a coverage report: the postgres-bearing legs
      # (default, all-features) currently fail their Postgres integration
      # tests for pre-existing reasons unrelated to coverage wiring (see
      # the PR description). The guard skips the step when the project
      # access token is absent (forks). The PR "Code Coverage" gate
      # (mode: check) is deferred until the CodeScene project's gates
      # configuration is enabled operator-side (project 77987 posts only
      # Code Health Review today).
      - name: Upload coverage to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: matrix.name == 'libsql-only' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@c6125f19593668cbfefd65a59c08cb7aefe90d93
        with:
          format: lcov
          mode: upload
          project-url: https://api.codescene.io/v2/projects/77987
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: ${{ matrix.name }}
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      # Report the hit rate so a wrapper that is silently doing nothing shows
      # up in the job summary rather than only in the duration.
      - name: Report sccache statistics
        if: always()
        run: |
          set -euo pipefail
          # Print to the log as well as the job summary. The summary is not
          # readable through the REST API, so the log copy is what lets anyone
          # confirm the hit rate, or a read or write error, after the fact.
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Report resource peaks
        if: always()
        run: ./scripts/ci-resource-sampler.sh report
  e2e-coverage:
    name: E2E Coverage
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    env:
      # sccache is the sole owner of compiler output: no cache step archives a
      # target tree. RUSTC_WRAPPER is what actually engages it; installing
      # sccache without exporting this compiles everything as before.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # sccache cannot cache incremental compilation.
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v6

      # Right-sizing needs the peak memory and the low-water disk mark, and
      # neither is visible in a job's own output. The sampler runs alongside
      # the build and reports both at the end, with `if: always()` so a job
      # that fails on resources still says so.
      - name: Start resource sampler
        run: ./scripts/ci-resource-sampler.sh start

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - name: Install mold
        uses: rui314/setup-mold@v1

      # Ubicloud's transparent cache proxy serves the Actions cache from a
      # local address. sccache's GitHub Actions backend reads
      # ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN from the runner's own
      # environment, which is not visible to `run:` steps, so re-export them.
      # Clearing ACTIONS_CACHE_SERVICE_V2 keeps sccache on the v1 protocol the
      # proxy serves; exporting ACTIONS_RESULTS_URL instead does not work.
      - name: Export the Actions cache endpoint for sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            // Ubicloud's control plane writes the proxy address into the VM
            // environment. Report which variable supplied it, and whether the
            // token was present at all, so a misconfigured backend is
            // diagnosable from the log rather than from a slower build. Never
            // print the token itself.
            const cacheUrl =
              process.env.ACTIONS_CACHE_URL ||
              process.env.CUSTOM_ACTIONS_CACHE_URL ||
              '';
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const source = process.env.ACTIONS_CACHE_URL
              ? 'ACTIONS_CACHE_URL'
              : process.env.CUSTOM_ACTIONS_CACHE_URL
                ? 'CUSTOM_ACTIONS_CACHE_URL'
                : 'none';
            core.info(`sccache cache endpoint source: ${source}`);
            core.info(`sccache cache endpoint present: ${Boolean(cacheUrl)}`);
            core.info(`sccache runtime token present: ${Boolean(runtimeToken)}`);
            if (!cacheUrl || !runtimeToken) {
              core.warning(
                'sccache has no Actions cache endpoint; every compilation ' +
                  'will miss and the wrapper will only add overhead',
              );
            }
            core.exportVariable('ACTIONS_CACHE_URL', cacheUrl);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', '');
      - name: Install sccache
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: sccache@0.16.0
          fallback: none
      - name: Start sccache statistics
        run: |
          set -euo pipefail
          sccache --version
          sccache --zero-stats
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
          fallback: none

      - name: Install cargo-binstall
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-binstall@1.20.1
          fallback: none

      - name: Install cargo-component
        env:
          CARGO_COMPONENT_PIN: ${{ env.CARGO_COMPONENT_VERSION }}
        run: >-
          cargo binstall --no-confirm
          --strategies crate-meta-data,quick-install
          "cargo-component@$CARGO_COMPONENT_PIN"

      - name: Probe Cargo tooling
        run: |
          set -euo pipefail
          cargo llvm-cov --version
          cargo component --version

      - name: Build WASM channels
        run: ./scripts/build-wasm-extensions.sh --channels

      - name: Set up coverage instrumentation
        run: |
          # show-env outputs shell-quoted values (KEY='value') but GITHUB_ENV
          # expects unquoted KEY=value. Strip only the wrapping single quotes
          # from KEY='value' lines without altering any internal characters.
          cargo llvm-cov show-env | sed -E \
            "s/^([A-Za-z_][A-Za-z0-9_]*)='(.*)'$/\1=\2/" >> "$GITHUB_ENV"

      - name: Clean coverage workspace
        run: cargo llvm-cov clean --workspace

      - name: Build instrumented binary
        run: cargo build --no-default-features --features libsql

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        run: |
          cd tests/e2e
          pip install -e .
          playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v -x --timeout=120
        env:
          RUST_LOG: axinite=info
          RUST_BACKTRACE: "1"

      - name: Verify profraw files exist
        if: always()
        run: |
          echo "LLVM_PROFILE_FILE=${LLVM_PROFILE_FILE}"
          echo "CARGO_LLVM_COV_TARGET_DIR=${CARGO_LLVM_COV_TARGET_DIR}"
          profraw_count=$(find target/ -name '*.profraw' 2>/dev/null | wc -l)
          echo "Found ${profraw_count} .profraw files under target/"
          find target/ -name '*.profraw' 2>/dev/null || true
          if [ "$profraw_count" -eq 0 ]; then
            echo \
              "::warning::No .profraw files found — coverage report will fail"
          fi

      - name: Generate coverage report
        if: always()
        run: cargo llvm-cov report --lcov --output-path e2e-coverage.info

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: e2e-coverage.info
          flags: e2e
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore

  # Roll-up for branch protection. Compares upstream results only.
      # Report the hit rate so a wrapper that is silently doing nothing shows
      # up in the job summary rather than only in the duration.
      - name: Report sccache statistics
        if: always()
        run: |
          set -euo pipefail
          # Print to the log as well as the job summary. The summary is not
          # readable through the REST API, so the log copy is what lets anyone
          # confirm the hit rate, or a read or write error, after the fact.
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Report resource peaks
        if: always()
        run: ./scripts/ci-resource-sampler.sh report
  coverage-gate:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [coverage, e2e-coverage]
    steps:
      - run: |
          if [[ "${{ needs.coverage.result }}" != "success" || \
            "${{ needs.e2e-coverage.result }}" != "success" ]]; then
            echo "One or more coverage jobs failed"
            exit 1
          fi
