---
name: E2E Tests
"on":
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6 AM UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/channels/web/**"
      - "tests/e2e/**"

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion.
# The group names this file rather than `github.workflow`: in a reusable
# workflow that expression resolves to the *caller's* name, which would
# put every workflow a single caller invokes into one group.
concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Step 1: compile once ──────────────────────────────────────────────────
  build:
    name: Build axinite (libsql)
    # Scheduled work does not run on paid runners. This workflow is both a
    # path-filtered pull-request gate and a weekly cron, so the label follows
    # the event rather than the job: Ubicloud on the developer path, where the
    # wall time is felt, GitHub-hosted for the Monday run, where it is not.
    #
    # The shape is `-4` because the sampler measured a cold compile peaking at
    # 6,797 MiB, which leaves no headroom in the 7,940 MiB a `-2` presents.
    # See `tests/workflow_contracts/runner_sizing_test.py`.
    # The second arm is the fork fallback: a pull request from a
    # fork cannot obtain an Ubicloud runner, so it runs
    # GitHub-hosted. A branch pull request, which is the one a
    # maintainer waits on, keeps the paid shape.
    runs-on: >-
      ${{ github.event_name == 'schedule' && 'ubuntu-latest'
      || github.event.pull_request.head.repo.fork && 'ubuntu-latest'
      || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    env:
      # sccache is the sole owner of compiler output: no cache step archives a
      # target tree. `setup-rust` names the wrapper, starts the server and
      # selects the backend from the runner (shared-actions ADR 0005).
      # sccache cannot cache incremental compilation.
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v6

      # Right-sizing needs the peak memory and the low-water disk mark, and
      # neither is visible in a job's own output. The sampler runs alongside
      # the build and reports both at the end, with `if: always()` so a job
      # that fails on resources still says so.
      - name: Start resource sampler
        run: ./scripts/ci-resource-sampler.sh start

      - uses: dtolnay/rust-toolchain@stable

      - name: Install mold
        uses: rui314/setup-mold@v1

      # sccache belongs to setup-rust: it exports Ubicloud's cache-proxy
      # credentials, clears the v2 cache-service flag the proxy does not
      # serve, installs and starts sccache and names it as the wrapper.
      # The toolchain, its targets and components stay with the step
      # above, so this passes an empty `rustflags` (the mold flags live
      # in CARGO_TARGET_*_RUSTFLAGS, which RUSTFLAGS would displace),
      # leaves the Cargo registry to this job's own cache step, and
      # installs no second cargo-binstall.
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@2f47859bcf82ae8b5bc10b457683fbd589ca2e41
        with:
          toolchain: stable
          rustflags: ''
          cache-provider: external
          install-binstall: 'false'
          # `any`: the schedule or fork arm lands on a GitHub-hosted
          # runner, where setup-rust keeps sccache on local disk.
          expect-cache: any
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Build
        run: cargo build --no-default-features --features libsql

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: axinite-e2e-binary
          path: target/debug/axinite
          retention-days: 1

  # ── Step 2: run test slices in parallel ───────────────────────────────────
      # Report the hit rate so a wrapper that is silently doing nothing shows
      # up in the job summary rather than only in the duration.
      - name: Report sccache statistics
        if: always()
        env:
          SCCACHE_BACKEND: ${{ steps.setup-rust.outputs.cache-backend }}
        run: |
          set -euo pipefail
          # Print to the log as well as the job summary. The summary is not
          # readable through the REST API, so the log copy is what lets anyone
          # confirm the hit rate, or a read or write error, after the fact.
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            # `Cache location` reads `ghac` for the proxy and GitHub alike, so
            # name the backend setup-rust chose.
            printf -- '- backend: %s\n\n' "${SCCACHE_BACKEND:-none}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Report resource peaks
        if: always()
        run: ./scripts/ci-resource-sampler.sh report
  test:
    name: E2E (${{ matrix.group }})
    needs: build
    # Follows the same event rule as `build` above.
    #
    # The shape is `-2` because this job compiles nothing: it downloads the
    # binary `build` produced and drives it from Playwright. The sampler
    # measured 1,273 to 1,432 MiB, under a fifth of what a `-2` presents.
    # The second arm is the fork fallback: a pull request from a
    # fork cannot obtain an Ubicloud runner, so it runs
    # GitHub-hosted. A branch pull request, which is the one a
    # maintainer waits on, keeps the paid shape.
    runs-on: >-
      ${{ github.event_name == 'schedule' && 'ubuntu-latest'
      || github.event.pull_request.head.repo.fork && 'ubuntu-latest'
      || 'ubicloud-standard-2' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            files: >-
              tests/e2e/scenarios/test_connection.py
              tests/e2e/scenarios/test_chat.py
              tests/e2e/scenarios/test_sse_reconnect.py
              tests/e2e/scenarios/test_html_injection.py
              tests/e2e/test_server_log.py
              tests/e2e/test_page_fixture.py
          - group: features
            files: >-
              tests/e2e/scenarios/test_skills.py
              tests/e2e/scenarios/test_tool_approval.py
          - group: extensions
            files: "tests/e2e/scenarios/test_extensions.py"
    steps:
      - uses: actions/checkout@v6

      # Right-sizing needs the peak memory and the low-water disk mark, and
      # neither is visible in a job's own output. The sampler runs alongside
      # the build and reports both at the end, with `if: always()` so a job
      # that fails on resources still says so.
      - name: Start resource sampler
        run: ./scripts/ci-resource-sampler.sh start

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: axinite-e2e-binary
          path: target/debug/

      - name: Make binary executable
        run: chmod +x target/debug/axinite

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        run: |
          cd tests/e2e
          pip install -e .
          playwright install --with-deps chromium

      - name: Run E2E tests (${{ matrix.group }})
        run: pytest ${{ matrix.files }} -v --timeout=120

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.group }}
          path: tests/e2e/screenshots/
          if-no-files-found: ignore

  # ── Roll-up for branch protection ────────────────────────────────────────
  # Roll-up for branch protection. Compares upstream results only.
      - name: Report resource peaks
        if: always()
        run: ./scripts/ci-resource-sampler.sh report
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [test]
    steps:
      - run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
