---
name: Formal Verification
"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight PR proof, but main and scheduled runs
# continue to completion.
concurrency:
  group: formal-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kani-smoke:
    name: Kani Smoke Proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # Where the Makefile expects the Kani release, so the action's
      # `cargo kani setup` writes the bundle there.
      KANI_HOME: ${{ github.workspace }}/.cache/kani/home
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install Kani
        # The install lands where `make kani` and `make kani-check` look: the
        # front-end in `.cache/kani/bin`, the bundle under `KANI_HOME`.
        uses: leynos/shared-actions/.github/actions/install-prover-tools@9ed445010fe26a7facb708d7a9ba4d5bd0fa57ca
        with:
          tools: kani
          runner-image: ubuntu2404
          kani-install-dir: .cache/kani/bin
      - name: Probe Kani
        run: make kani-check
      - name: Run Kani proof
        run: make kani

  verus-proofs:
    name: Verus Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Install Verus and Z3
        # Z3 lands at `Z3_INSTALL_DIR`, where `make verus` looks for it.
        uses: leynos/shared-actions/.github/actions/install-prover-tools@9ed445010fe26a7facb708d7a9ba4d5bd0fa57ca
        with:
          tools: verus
          runner-image: ubuntu2404
          z3-install-dir: .cache/z3/4.16.0
      - name: Run Verus proofs
        run: make verus
