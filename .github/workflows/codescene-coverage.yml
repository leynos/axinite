---
name: CodeScene Coverage Check
"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-check:
    name: CodeScene Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-8
    timeout-minutes: 60
    env:
      CARGO_COMPONENT_VERSION: '0.21.1'
      CARGO_LLVM_COV_VERSION: '0.8.7'
      CARGO_NEXTEST_VERSION: '0.9.140'
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
          fallback: none

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
          fallback: none

      - name: Install cargo-binstall
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-binstall@1.20.1
          fallback: none

      - name: Install cargo-component
        env:
          CARGO_COMPONENT_PIN: ${{ env.CARGO_COMPONENT_VERSION }}
        run: >-
          cargo binstall --no-confirm
          --strategies crate-meta-data,quick-install
          "cargo-component@${{ env.CARGO_COMPONENT_PIN }}"

      - name: Probe Cargo tooling
        run: |
          set -euo pipefail
          cargo llvm-cov --version
          cargo nextest --version
          cargo component --version

      - name: Build GitHub WASM tool (for metadata/schema tests)
        run: make build-github-tool-wasm

      - name: Build WASM channels (for integration tests)
        run: ./scripts/build-wasm-extensions.sh --channels

      - name: Generate coverage
        run: >-
          cargo llvm-cov nextest --no-default-features --features libsql
          --features test-helpers --workspace --lcov
          --output-path lcov.info

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'pull_request' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@f6d4d5f549655c118f86f371b8d55c200d3efa50
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/77987
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

