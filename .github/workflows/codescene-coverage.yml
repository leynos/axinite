---
# The pull-request coverage lane. It measures the libsql-only suite and
# ratchets it against the baseline `coverage.yml` writes on every push to
# `main`, and it never contacts CodeScene: no token, no uploader, no
# `codescene.io`. CodeScene accepts coverage only for a branch it analyses,
# and a lane a pull request can start is the wrong side of the repository to
# hold the token that authenticates to it. `coverage.yml` is the one
# publisher. The file keeps its old name so the contracts and the
# developers' guide that name it stay stable; the workflow and job names say
# what it does now.
name: Coverage Ratchet
"on":
  pull_request:
    branches: [main]
  # Manual runs exist to re-measure a warm cache on `main`. The registry
  # cache is restore-only here, and generate-coverage saves the ratchet
  # baseline only on a push to `main`, so a dispatch measures and compares
  # without advancing anything.
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage-check:
    name: Coverage Ratchet
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    # A pull request from a fork cannot obtain an Ubicloud
    # runner, so it falls back to a GitHub-hosted one. Branch
    # pull requests, which are the ones a maintainer waits on,
    # keep the paid shape.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest'
      || 'ubicloud-standard-4' }}
    timeout-minutes: 90
    env:
      # sccache is the sole owner of compiler output: no cache step archives a
      # target tree. RUSTC_WRAPPER is what actually engages it; installing
      # sccache without exporting this compiles everything as before.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # sccache cannot cache incremental compilation.
      CARGO_INCREMENTAL: "0"
      CARGO_COMPONENT_VERSION: '0.21.1'
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v6

      # Right-sizing needs the peak memory and the low-water disk mark, and
      # neither is visible in a job's own output. The sampler runs alongside
      # the build and reports both at the end, with `if: always()` so a job
      # that fails on resources still says so.
      - name: Start resource sampler
        run: ./scripts/ci-resource-sampler.sh start

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install mold
        uses: rui314/setup-mold@v1

      # Ubicloud's transparent cache proxy serves the Actions cache from a
      # local address. sccache's GitHub Actions backend reads
      # ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN from the runner's own
      # environment, which is not visible to `run:` steps, so re-export them.
      # Clearing ACTIONS_CACHE_SERVICE_V2 keeps sccache on the v1 protocol the
      # proxy serves; exporting ACTIONS_RESULTS_URL instead does not work.
      - name: Export the Actions cache endpoint for sccache
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            // Ubicloud's control plane writes the proxy address into the VM
            // environment. Report which variable supplied it, and whether the
            // token was present at all, so a misconfigured backend is
            // diagnosable from the log rather than from a slower build. Never
            // print the token itself.
            const cacheUrl =
              process.env.ACTIONS_CACHE_URL ||
              process.env.CUSTOM_ACTIONS_CACHE_URL ||
              '';
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const source = process.env.ACTIONS_CACHE_URL
              ? 'ACTIONS_CACHE_URL'
              : process.env.CUSTOM_ACTIONS_CACHE_URL
                ? 'CUSTOM_ACTIONS_CACHE_URL'
                : 'none';
            core.info(`sccache cache endpoint source: ${source}`);
            core.info(`sccache cache endpoint present: ${Boolean(cacheUrl)}`);
            core.info(`sccache runtime token present: ${Boolean(runtimeToken)}`);
            if (!cacheUrl || !runtimeToken) {
              core.warning(
                'sccache has no Actions cache endpoint; every compilation ' +
                  'will miss and the wrapper will only add overhead',
              );
            }
            core.exportVariable('ACTIONS_CACHE_URL', cacheUrl);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', '');
      - name: Install sccache
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: sccache@0.16.0
          fallback: none
      - name: Start sccache statistics
        run: |
          set -euo pipefail
          sccache --version
          sccache --zero-stats
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-

      - name: Install cargo-binstall
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-binstall@1.20.1
          fallback: none

      - name: Install cargo-component
        env:
          CARGO_COMPONENT_PIN: ${{ env.CARGO_COMPONENT_VERSION }}
        run: >-
          cargo binstall --no-confirm
          --strategies crate-meta-data,quick-install
          "cargo-component@$CARGO_COMPONENT_PIN"

      - name: Probe Cargo tooling
        run: |
          set -euo pipefail
          cargo component --version

      - name: Build GitHub WASM tool (for metadata/schema tests)
        run: make build-github-tool-wasm

      - name: Build WASM channels (for integration tests)
        run: ./scripts/build-wasm-extensions.sh --channels

      # The same selection as the libsql-only leg of `coverage.yml`, which
      # writes the baseline this compares against: a ratchet measuring a
      # different feature set would report the difference in features as a
      # difference in coverage. The action installs its own pinned
      # cargo-llvm-cov and cargo-nextest, and `cache-provider: external`
      # leaves the registry to the restore step above and compiler output to
      # sccache. The report stays on the runner: nothing downstream reads an
      # artefact from a pull request.
      - name: Generate coverage
        # `ci` matches what `test.yml`'s libsql-only leg ran before this lane
        # replaced it. The default profile would drop the trybuild compile
        # contracts, and the replacement would be narrower than the leg it
        # stands in for. The action has no profile input; nextest reads the
        # variable, and a composite action's steps inherit the step's env.
        env:
          NEXTEST_PROFILE: ci
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          features: libsql,test-helpers
          with-default-features: 'false'
          use-cargo-nextest: 'true'
          # The third timeout tier. The action's 1,800 s default equals the
          # 30 m nextest whole-run budget and also has to cover the
          # instrumented build, so it would kill a legal run first. 4,200 s
          # is the slowest measured invocation (1,549 s) plus the full 1,800 s
          # budget plus headroom, under the 5,400 s job ceiling; the guide's
          # timeout section has the numbers, and `timeout_ordering_test.py`
          # asserts nextest < watchdog < job.
          cargo-wait-timeout: '4200'
          format: lcov
          output-path: lcov.info
          with-ratchet: 'true'
          publish-artefact: 'false'
          cache-provider: external
      # Report the hit rate so a wrapper that is silently doing nothing shows
      # up in the job summary rather than only in the duration.
      - name: Report sccache statistics
        if: always()
        run: |
          set -euo pipefail
          # Print to the log as well as the job summary. The summary is not
          # readable through the REST API, so the log copy is what lets anyone
          # confirm the hit rate, or a read or write error, after the fact.
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Report resource peaks
        if: always()
        run: ./scripts/ci-resource-sampler.sh report
