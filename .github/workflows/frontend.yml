---
name: Frontend
"on":
  pull_request:
    branches:
      - main
    paths:
      - "web-src/**"
      - "src/channels/web/static/solid/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "web-src/**"
      - "src/channels/web/static/solid/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, which has no successor waiting, always
# runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job reads the checkout and writes nothing.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend verification
    # The chain runs Bun, vitest, and Playwright and compiles no Rust, so it
    # takes the free hosted pool rather than a paid Ubicloud shape; forks can
    # run it too.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # playwright.config.ts pins the hermetic browsers path at test time;
      # the install step must target the same location.
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      # Actions are pinned to immutable commits; the comment names the release.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Later steps run repository scripts; keep the token out of .git.
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          # Pinned for reproducible CI; matches the bun-types release in
          # web-src/bun.lock and satisfies the package's `bun >=1.1.41` engine.
          bun-version: "1.3.11"
      - name: Install uv
        # `semantic` and `verify:full` fetch semgrep and moz-fluent-linter
        # through uvx.
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install dependencies
        run: make frontend-install
      - name: Install Playwright Chromium
        working-directory: web-src
        run: bunx playwright install --with-deps chromium
      - name: Full verification chain
        # Tailwind compile check, Biome lint, TypeScript, vitest unit and
        # accessibility suites, Fluent variable/coverage checks, the
        # semantic-CSS rules, the workspace Playwright spec, and
        # moz-fluent-lint.
        run: make frontend-full
      - name: Embedded asset staleness gate
        # Rebuild the SPA and fail when src/channels/web/static/solid does
        # not match the web-src sources.
        run: make frontend-verify
