---
name: Run Tests
"on":
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Tool pins shared by every job. Each tool is installed from a pinned,
# checksum-verified release archive by taiki-e/install-action with
# `fallback: none`, so a missing prebuilt binary fails the job instead of
# silently compiling from source.
env:
  CARGO_AUDIT_VERSION: '0.22.2'
  CARGO_COMPONENT_VERSION: '0.21.1'
  CARGO_NEXTEST_VERSION: '0.9.143'

jobs:
  audit:
    name: Dependency Audit
    # Dependency audits report advisories against the whole lockfile, so a
    # newly published advisory would fail every Dependabot PR regardless of
    # content and deadlock auto-merge. The scheduled audit workflow covers
    # Dependabot merges instead.
    if: >
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref != 'staging'))
      && github.actor != 'dependabot[bot]'
    # API-bound: cargo-audit reads the lockfiles and the RustSec advisory
    # database over the network. It compiles nothing, so it is GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}
          fallback: none
      - name: Probe cargo-audit
        run: cargo audit --version
      - name: Audit dependencies
        run: make audit

  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubicloud-standard-8
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            flags: "--features postgres,libsql,html-to-markdown"
          - name: default
            flags: ""
          - name: libsql-only
            flags: "--no-default-features --features libsql"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install mold
        uses: rui314/setup-mold@v1
      # Sole writer of the Linux cargo-registry key family. The `target` tree
      # is deliberately not archived: sccache owns compiler output from the
      # migration wave onwards, and a target archive duplicates that
      # ownership while inflating the weekly cache quota.
      - name: Restore Cargo registry and index
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
          fallback: none
      - name: Install cargo-component
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-component@${{ env.CARGO_COMPONENT_VERSION }}
          fallback: none
      - name: Probe Cargo tooling
        run: |
          set -euo pipefail
          cargo nextest --version
          cargo component --version
      - name: Build GitHub WASM tool (for metadata/schema tests)
        run: make build-github-tool-wasm
      - name: Build WASM channels (for integration tests)
        run: ./scripts/build-wasm-extensions.sh --channels
      - name: Run Tests
        run: >-
          make test
          NEXTEST_PROFILE=ci
          TEST_FEATURES="${{ matrix.flags }} --features test-helpers"
      # One writer per key: the all-features leg resolves the widest
      # dependency graph, so it publishes the registry archive from main.
      - name: Save Cargo registry and index
        if: >-
          matrix.name == 'all-features' && github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}

  telegram-tests:
    name: Telegram Channel Tests
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref != 'staging')
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install mold
        uses: rui314/setup-mold@v1
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Run Telegram Channel Tests
        run: >-
          cargo test --manifest-path channels-src/telegram/Cargo.toml --
          --nocapture

  windows-build:
    name: Windows Build (${{ matrix.name }})
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref != 'staging')
    # Windows lanes stay on GitHub-hosted runners: Ubicloud offers Linux only.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            flags: "--all-features"
          - name: default
            flags: ""
          - name: libsql-only
            flags: "--no-default-features --features libsql"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo registry and index
        id: cargo-registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Check compilation
        run: >-
          cargo check --all --benches --tests --examples
          ${{ matrix.flags }} --features test-helpers
      # Sole writer of the Windows cargo-registry key family.
      - name: Save Cargo registry and index
        if: >-
          matrix.name == 'all-features' && github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}

  wasm-wit-compat:
    name: WASM WIT Compatibility
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref != 'staging')
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install mold
        uses: rui314/setup-mold@v1
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Install cargo-component
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb  # v2.83.0
        with:
          tool: cargo-component@${{ env.CARGO_COMPONENT_VERSION }}
          fallback: none
      - name: Probe cargo-component
        run: cargo component --version
      - name: Build all WASM extensions against current WIT
        run: ./scripts/build-wasm-extensions.sh
      - name: Instantiation test (host linker compatibility)
        run: cargo test --all-features --features test-helpers wit_compat -- --nocapture

  docker-build:
    name: Docker Build
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref != 'staging')
    # Stays on its current label. Moving a privileged, daemon-dependent job
    # needs a Docker daemon and privilege preflight first; see the
    # decomposition plan in docs/developers-guide.md.
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t axinite-test:ci .

  version-check:
    name: Version Bump Check
    # Metadata check over the Git history and PR labels. No build, so it is
    # GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version bumps for changed extensions
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/check-version-bumps.sh

  # Roll-up job for branch protection. Compares upstream results only.
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - audit
      - tests
      - telegram-tests
      - wasm-wit-compat
      - docker-build
      - windows-build
      - version-check
    steps:
      - run: |
          # Unit tests must always pass
          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          # Gated jobs must pass on promotion PRs and push events.
          # On developer PRs they may be skipped.
          for job in \
            audit telegram-tests wasm-wit-compat docker-build \
            windows-build version-check; do
            case "$job" in
              audit) result="${{ needs.audit.result }}" ;;
              telegram-tests) result="${{ needs.telegram-tests.result }}" ;;
              wasm-wit-compat) result="${{ needs.wasm-wit-compat.result }}" ;;
              docker-build) result="${{ needs.docker-build.result }}" ;;
              windows-build) result="${{ needs.windows-build.result }}" ;;
              version-check) result="${{ needs.version-check.result }}" ;;
            esac
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "$job failed"
              exit 1
            fi
          done
