---
name: Code Style
"on":
  pull_request:
  # Manual runs exist to re-measure a warm cache on `main`. No
  # `actions/cache` save step is keyed here, so a dispatch cannot take
  # ownership of a key from the job that writes it on push. sccache's own
  # store is content-addressed and has no single writer.
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a push to `main`, a schedule, or a dispatch, none of which
# has a successor waiting, always runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here reads the checkout and writes nothing. Without this
# block each job inherits the repository or organization default
# `GITHUB_TOKEN` scopes, which can be write-capable, and these jobs run
# third-party actions and repository commands. Nothing here uses the
# token for anything but the checkout: no step references
# `secrets.GITHUB_TOKEN`, `github.token` or an OIDC identity, and
# sccache's cache and `actions/cache` authenticate with the runtime
# token rather than this one.
permissions:
  contents: read

env:
  # The version the coverage and test lanes install. The workflow-contract
  # suite hands `.config/nextest.toml` to this runner and takes its verdict,
  # so a contract run against a different release would answer for a
  # configuration nothing else loads.
  CARGO_NEXTEST_VERSION: '0.9.140'

jobs:
  format:
    name: Formatting
    # Build/test class: compiles nothing heavy but runs the repository's
    # formatter, spelling, Mermaid, and workflow-contract gates on the
    # developer feedback path.
    # A pull request from a fork cannot obtain an Ubicloud
    # runner, so it falls back to a GitHub-hosted one. Branch
    # pull requests, which are the ones a maintainer waits on,
    # keep the paid shape.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest'
      || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Right-sizing needs the peak memory and the low-water disk mark, and
      # neither is visible in a job's own output. The sampler runs alongside
      # the build and reports both at the end, with `if: always()` so a job
      # that fails on resources still says so.
      - name: Start resource sampler
        run: ./scripts/ci-resource-sampler.sh start

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install mdtablefix
        # `make check-fmt` needs `--check` and `--git` (available since 0.6.0).
        # Version 0.6.1 preserves escaped ordered-list text in Markdown files.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.1"
      - name: Check formatting
        run: make check-fmt
      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: '3.14'
          enable-cache: true
      # Installs pinned Nixie and a checksum-verified Merman CLI release
      # archive. This replaces the previous `cargo install merman-cli`
      # source build and its bespoke ~/.cargo/bin/merman-cli cache.
      - name: Install Nixie and Merman CLI
        uses: leynos/shared-actions/.github/actions/install-nixie@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          nixie-version: '1.1.0'
          merman-version: '0.7.0'
          python-version: '3.14'
      - name: Probe Mermaid toolchain
        run: |
          set -euo pipefail
          command -v nixie >/dev/null
          command -v merman-cli >/dev/null
          # nixie exposes no --version flag; --help proves the shim resolves
          # to a working interpreter and entry point.
          nixie --help >/dev/null
          merman-cli --version
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Validate Mermaid diagrams
        run: make nixie
      # The workflow-contract suite loads `.config/nextest.toml` with nextest
      # itself, in a three-binary fixture crate, because every other contract
      # over that file reads it with `tomllib` and cannot see a key the
      # runner ignores. Deleting this step reddens that contract rather than
      # skipping it.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
          fallback: none
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Report resource peaks
        if: always()
        run: ./scripts/ci-resource-sampler.sh report

  clippy:
    name: Clippy (${{ matrix.name }})
    # Build/test class: compiles the workspace under three feature shapes.
    # A pull request from a fork cannot obtain an Ubicloud
    # runner, so it falls back to a GitHub-hosted one. Branch
    # pull requests, which are the ones a maintainer waits on,
    # keep the paid shape.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest'
      || 'ubicloud-standard-4' }}
    timeout-minutes: 75
    env:
      # sccache is the sole owner of compiler output: no cache step archives a
      # target tree. `setup-rust` names the wrapper, starts the server and
      # selects the backend from the runner (shared-actions ADR 0005).
      # sccache cannot cache incremental compilation.
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    strategy:
      fail-fast: false
      matrix:
        include:
          # Whitaker lints under its own pinned toolchain, so re-running it
          # per matrix leg repeats identical work; it runs on the
          # all-features leg only.
          - name: all-features
            flags: "--all-features"
            whitaker: true
          - name: default
            flags: ""
          - name: libsql-only
            flags: "--no-default-features --features libsql"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Right-sizing needs the peak memory and the low-water disk mark, and
      # neither is visible in a job's own output. The sampler runs alongside
      # the build and reports both at the end, with `if: always()` so a job
      # that fails on resources still says so.
      - name: Start resource sampler
        run: ./scripts/ci-resource-sampler.sh start

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install mold
        uses: rui314/setup-mold@v1
      # Registry and Git index only. The `tests` job in test.yml is the sole
      # writer of this key family; pull-request jobs restore and never save.
      # sccache belongs to setup-rust: it exports Ubicloud's cache-proxy
      # credentials, clears the v2 cache-service flag the proxy does not
      # serve, installs and starts sccache and names it as the wrapper.
      # The toolchain, its targets and components stay with the step
      # above, so this passes an empty `rustflags` (the mold flags live
      # in CARGO_TARGET_*_RUSTFLAGS, which RUSTFLAGS would displace),
      # leaves the Cargo registry to this job's own cache step, and
      # installs no second cargo-binstall.
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          toolchain: stable
          rustflags: ''
          cache-provider: external
          install-binstall: 'false'
          # `any`: the fork arm lands on a GitHub-hosted runner, where
          # setup-rust keeps sccache on local disk.
          expect-cache: any
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Check lints
        run: >-
          cargo clippy --all --benches --tests --examples ${{ matrix.flags }}
          -- -D warnings
      # Installs the pinned whitaker-installer release archive, verifies its
      # published SHA-256 against the action's digest manifest, and owns the
      # installer and suite cache. This replaces the previous cargo-binstall
      # attempt with a `cargo install` source-build fallback.
      - name: Install Whitaker
        if: matrix.whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          installer-version: '0.2.9'
          cache-provider: github
      - name: Probe Whitaker
        if: matrix.whitaker
        run: |
          set -euo pipefail
          command -v whitaker >/dev/null
          whitaker --version
          # The action records the installer version it installed in a marker
          # beside the binary. Read that rather than running the installer, so
          # a stale or wrong installer fails here instead of somewhere far from
          # the cause, and the workflow still never invokes it by hand.
          read -r installed _ < "${HOME}/.cargo/bin/.whitaker-installer-version"
          test "${installed}" = "0.2.9"
      - name: Whitaker Dylint suite
        if: matrix.whitaker
        run: make lint-whitaker
      # Report the hit rate so a wrapper that is silently doing nothing shows
      # up in the job summary rather than only in the duration.
      - name: Report sccache statistics
        if: always()
        env:
          SCCACHE_BACKEND: ${{ steps.setup-rust.outputs.cache-backend }}
        run: |
          set -euo pipefail
          # Print to the log as well as the job summary. The summary is not
          # readable through the REST API, so the log copy is what lets anyone
          # confirm the hit rate, or a read or write error, after the fact.
          stats="$(sccache --show-stats)"
          printf '%s\n' "$stats"
          {
            printf '### sccache statistics (%s)\n\n' "${GITHUB_JOB}"
            # `Cache location` reads `ghac` for the proxy and GitHub alike, so
            # name the backend setup-rust chose.
            printf -- '- backend: %s\n\n' "${SCCACHE_BACKEND:-none}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Report resource peaks
        if: always()
        run: ./scripts/ci-resource-sampler.sh report
  clippy-windows:
    name: Clippy Windows (${{ matrix.name }})
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    # Windows lanes stay on GitHub-hosted runners: Ubicloud offers Linux only.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            flags: "--all-features"
          - name: default
            flags: ""
          - name: libsql-only
            flags: "--no-default-features --features libsql"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Keyed by runner.os, runner.arch, and runner.environment so a Linux
      # archive is never restored onto Windows. windows-build in test.yml is
      # the sole writer of the Windows key family.
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Check lints
        run: >-
          cargo clippy --all --benches --tests --examples ${{ matrix.flags }}
          -- -D warnings

  # Roll-up job for branch protection. Compares upstream results and runs no
  # build, so it belongs on a GitHub-hosted runner.
  code-style:
    name: Code Style (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs: [format, clippy, clippy-windows]
    steps:
      - run: |
          if [[ "${{ needs.format.result }}" != "success" || \
            "${{ needs.clippy.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          # clippy-windows only runs on main PRs.
          # Skip and success are both acceptable.
          if [[ "${{ needs.clippy-windows.result }}" == "failure" ]]; then
            echo "Windows clippy failed"
            exit 1
          fi
