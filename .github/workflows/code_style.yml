---
name: Code Style
"on":
  pull_request:

jobs:
  format:
    name: Formatting
    # Build/test class: compiles nothing heavy but runs the repository's
    # formatter, spelling, Mermaid, and workflow-contract gates on the
    # developer feedback path.
    runs-on: ubicloud-standard-8
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          python-version: '3.14'
          enable-cache: true
      # Installs pinned Nixie and a checksum-verified Merman CLI release
      # archive. This replaces the previous `cargo install merman-cli`
      # source build and its bespoke ~/.cargo/bin/merman-cli cache.
      - name: Install Nixie and Merman CLI
        uses: leynos/shared-actions/.github/actions/install-nixie@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          nixie-version: '1.1.0'
          merman-version: '0.7.0'
          python-version: '3.14'
      - name: Probe Mermaid toolchain
        run: |
          set -euo pipefail
          command -v nixie >/dev/null
          command -v merman-cli >/dev/null
          nixie --version
          merman-cli --version
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Validate Mermaid diagrams
        run: make nixie
      - name: Workflow contract tests
        run: make test-workflow-contracts

  clippy:
    name: Clippy (${{ matrix.name }})
    # Build/test class: compiles the workspace under three feature shapes.
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
    strategy:
      fail-fast: false
      matrix:
        include:
          # Whitaker lints under its own pinned toolchain, so re-running it
          # per matrix leg repeats identical work; it runs on the
          # all-features leg only.
          - name: all-features
            flags: "--all-features"
            whitaker: true
          - name: default
            flags: ""
          - name: libsql-only
            flags: "--no-default-features --features libsql"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install mold
        uses: rui314/setup-mold@v1
      # Registry and Git index only. The `tests` job in test.yml is the sole
      # writer of this key family; pull-request jobs restore and never save.
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Check lints
        run: >-
          cargo clippy --all --benches --tests --examples ${{ matrix.flags }}
          -- -D warnings
      # Installs the pinned whitaker-installer release archive, verifies its
      # published SHA-256 against the action's digest manifest, and owns the
      # installer and suite cache. This replaces the previous cargo-binstall
      # attempt with a `cargo install` source-build fallback.
      - name: Install Whitaker
        if: matrix.whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@7d46a399558914f5a05074e55a560fec0269fd0d
        with:
          installer-version: '0.2.7'
          cache-provider: github
      - name: Probe Whitaker
        if: matrix.whitaker
        run: |
          set -euo pipefail
          command -v whitaker >/dev/null
          whitaker --version
      - name: Whitaker Dylint suite
        if: matrix.whitaker
        run: make lint-whitaker

  clippy-windows:
    name: Clippy Windows (${{ matrix.name }})
    if: github.base_ref == 'main'
    # Windows lanes stay on GitHub-hosted runners: Ubicloud offers Linux only.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-features
            flags: "--all-features"
          - name: default
            flags: ""
          - name: libsql-only
            flags: "--no-default-features --features libsql"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Keyed by runner.os, runner.arch, and runner.environment so a Linux
      # archive is never restored onto Windows. windows-build in test.yml is
      # the sole writer of the Windows key family.
      - name: Restore Cargo registry and index
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment
            }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Check lints
        run: >-
          cargo clippy --all --benches --tests --examples ${{ matrix.flags }}
          -- -D warnings

  # Roll-up job for branch protection. Compares upstream results and runs no
  # build, so it belongs on a GitHub-hosted runner.
  code-style:
    name: Code Style (fmt + clippy)
    runs-on: ubuntu-latest
    if: always()
    needs: [format, clippy, clippy-windows]
    steps:
      - run: |
          if [[ "${{ needs.format.result }}" != "success" || \
            "${{ needs.clippy.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          # clippy-windows only runs on main PRs.
          # Skip and success are both acceptable.
          if [[ "${{ needs.clippy-windows.result }}" == "failure" ]]; then
            echo "Windows clippy failed"
            exit 1
          fi
