version: 2

updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/channels-src/discord"
      - "/channels-src/slack"
      - "/channels-src/telegram"
      - "/channels-src/whatsapp"
      - "/fuzz"
      - "/tools-src/github"
      - "/tools-src/gmail"
      - "/tools-src/google-calendar"
      - "/tools-src/google-docs"
      - "/tools-src/google-drive"
      - "/tools-src/google-sheets"
      - "/tools-src/google-slides"
      - "/tools-src/slack"
      - "/tools-src/telegram"
      - "/tools-src/web-search"
    groups:
      # The rstest-bdd crates release in lockstep and one bumped alone does not
      # build. Cargo counts a 0.x minor as a major, which the catch-all leaves
      # ungrouped, so this group keeps the family in one pull request. It must
      # precede the catch-all: Dependabot uses the first group that matches.
      rstest-bdd:
        patterns:
          - "rstest-bdd*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "pip"
    directory: "/tests/e2e"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
