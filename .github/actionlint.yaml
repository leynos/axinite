# actionlint configuration.
#
# Register every intentional non-GitHub runner label so actionlint does not
# report it as an unknown runner. List only labels this repository actually
# references: an unused entry hides a typo in a real one.
#
# The Linux jobs are right-sized per job rather than uniformly.
# ubicloud-standard-4 carries the jobs that compile the workspace;
# ubicloud-standard-2 carries the jobs that compile little or nothing.
# `tests/workflow_contracts/runner_placement_test.py` keeps this list exactly
# in step with the labels the workflows reference, in both directions.
self-hosted-runner:
  labels:
    - ubicloud-standard-2
    - ubicloud-standard-4
    - ubicloud-standard-8
