[package]
name = "slack-channel"
version = "0.2.2"
edition = "2021"
description = "Slack Events API channel for Axinite"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindgen for WASM component model
wit-bindgen = "0.36"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[profile.release]
# Optimize for size
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Unsafe policy: `deny`, not `forbid`, because the generated component
# bindings in src/bindings.rs are an irreducible ABI boundary and `forbid`
# cannot be overridden (E0453). Only that module may carry
# `#[expect(unsafe_code)]`. This is the complete lint table; when the
# estate lint configuration lands it must keep `unsafe_code = "deny"`
# here and must not use `[lints] workspace = true`. See
# docs/adr-015-audited-unsafe-boundaries.md.
[lints.rust]
unsafe_code = "deny"

[workspace]
