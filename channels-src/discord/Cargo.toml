[package]
name = "discord-channel"
version = "0.2.0"
edition = "2021"
description = "Discord channel for Axinite"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.36"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1



# Unsafe policy: `deny`, not `forbid`, because the generated component
# bindings in src/bindings.rs are an irreducible ABI boundary and `forbid`
# cannot be overridden (E0453). Only that module may carry
# `#[expect(unsafe_code)]`. This is the complete lint table; when the
# estate lint configuration lands it must keep `unsafe_code = "deny"`
# here and must not use `[lints] workspace = true`. See
# docs/adrs/adr-0015-audited-unsafe-boundaries.md.
[lints.rust]
unsafe_code = "deny"

[workspace]
