# This package is intentionally outside the root workspace. Monty requires
# Rust 1.98 while the workspace's published MSRV is 1.95, and the MSRV lane
# checks `cargo check --workspace`. Build and test it explicitly with
# `make test-monty-helper`; the parent never links it as a library.
[workspace]

[package]
name = "axinite-monty-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Isolated Monty interpreter helper for Axinite exec_code"
license = "MIT OR Apache-2.0"

[[bin]]
name = "axinite-monty-helper"
path = "src/main.rs"

[dependencies]
monty = "=1.6.0"
monty-types = "=1.6.0"
monty-alloc = { version = "=1.6.0", features = ["exit-code"] }
monty-protocol = { path = "../monty-protocol" }
serde_json = "1"
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[dev-dependencies]
pretty_assertions = "1"