[package]
name = "ambient-fs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Deliberately-ambient filesystem boundary for the axinite host"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fs4 = "0.6"

[dev-dependencies]
tempfile = "3"

# Unsafe policy: forbidden in every target. See
# docs/adr-015-audited-unsafe-boundaries.md.
[lints.rust]
unsafe_code = "forbid"
