# A crate that exists only to put `.config/nextest.toml` to nextest itself.
#
# `cargo nextest show-config` resolves profile overrides against the test
# binaries the package declares and refuses a filterset naming an unknown
# binary. The compile-contract binaries also contain a cross-process overlap
# detector used to prove that the configured test group serialises them.
#
# The two names are not arbitrary: they are the compile-contract binaries
# selected by the real overrides, so nextest resolves the same filtersets.
# `compile_contract_budget_test` keeps this pair tied to source discovery.
#
# `[workspace]` makes this its own workspace root, so the repository's
# workspace neither builds it nor lints it.
[package]
name = "nextest-boundary-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
