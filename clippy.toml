# Complexity guardrails for AI-assisted development quality.
# These thresholds prevent new violations while preserving existing code.
# See: https://github.com/nearai/ironclaw/issues/338

cognitive-complexity-threshold = 15  # default: 25 (only active when lint is enabled)
too-many-lines-threshold = 100      # default: 100 (only active when lint is enabled)
too-many-arguments-threshold = 7    # default: 7 (keep default, avoids new violations)
type-complexity-threshold = 250     # default: 250 (keep default, avoids new violations)

# Environment is a process-global resource. Capture it once at the composition
# boundary and pass EnvContext through the application instead of reading or
# mutating it from production code or in-process tests.
disallowed-methods = [
  { path = "std::env::var", reason = "inject an environment reader" },
  { path = "std::env::var_os", reason = "inject an environment reader" },
  { path = "std::env::vars", reason = "inject an environment reader" },
  { path = "std::env::vars_os", reason = "inject an environment reader" },
  { path = "std::env::set_var", reason = "use a stub environment in tests" },
  { path = "std::env::remove_var", reason = "use a stub environment in tests" },
  { path = "std::env::set_current_dir", reason = "inject a base-directory seam; confine CWD changes to Command::current_dir" },
  { path = "dotenvy::dotenv", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::dotenv_override", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::from_path", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::from_path_override", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::from_filename", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::from_filename_override", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::from_read", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::from_read_override", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::var", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::vars", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::Iter::load", reason = "mutates the process environment; use DotenvLayers" },
  { path = "dotenvy::Iter::load_override", reason = "mutates the process environment; use DotenvLayers" },
]
